<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#EAE5D9"/>
  <!-- Subtle background circle -->
  <circle cx="300" cy="180" r="110" fill="#DFD9CB"/>
  <circle cx="300" cy="180" r="90" fill="#D3CCA" stroke="#C4BCA8" stroke-width="2"/>
  
  <!-- Botanical Stevia Leaf Motif -->
  <g transform="translate(300, 175) scale(1.1)">
    <!-- Central Stem -->
    <path d="M0 60 C-2 30 0 -10 0 -50" stroke="#2D6A4F" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Top Leaf -->
    <path d="M0 -50 C-20 -70 0 -95 0 -95 C0 -95 20 -70 0 -50 Z" fill="#40916C" stroke="#1B4332" stroke-width="1.5"/>
    <path d="M0 -50 L0 -90" stroke="#1B4332" stroke-width="1.5"/>
    
    <!-- Left Leaf 1 -->
    <path d="M-2 -30 C-35 -40 -45 -10 -40 0 C-20 5 -5 -15 -2 -30 Z" fill="#52B788" stroke="#1B4332" stroke-width="1.5"/>
    <!-- Right Leaf 1 -->
    <path d="M2 -30 C35 -40 45 -10 40 0 C20 5 5 -15 2 -30 Z" fill="#52B788" stroke="#1B4332" stroke-width="1.5"/>
    
    <!-- Left Leaf 2 -->
    <path d="M-2 5 C-40 -5 -50 25 -45 35 C-25 40 -5 20 -2 5 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.5"/>
    <!-- Right Leaf 2 -->
    <path d="M2 5 C40 -5 50 25 45 35 C25 40 5 20 2 5 Z" fill="#74C69D" stroke="#1B4332" stroke-width="1.5"/>
    
    <!-- Powder Mound Illustration -->
    <ellipse cx="0" cy="65" rx="65" ry="18" fill="#B7E4C7" opacity="0.9"/>
    <ellipse cx="0" cy="62" rx="55" ry="14" fill="#D8F3DC"/>
  </g>
  
  <!-- Clean Product Label -->
  <rect x="180" y="310" width="240" height="38" rx="19" fill="#1E293B"/>
  <text x="300" y="334" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">STEVIA POWDER</text>
  <text x="300" y="370" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pure Stevia rebaudiana • Direct from India</text>
</svg>

